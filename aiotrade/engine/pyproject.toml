[project]
name = "aiotrade"
version = "0.2.0"
description = "Co-pilote de gestion des risques : filtre chi2, Macro Gate, TAP, SCG, Kelly fractionnaire, XAI Ledger"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "fastapi>=0.110,<1", "uvicorn[standard]>=0.29,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
# Modèle de fondation Kronos (optionnel, lourd) : cloner https://github.com/shiyu-coder/Kronos et l'ajouter au PYTHONPATH.
kronos = ["torch>=2.2", "pandas>=2.0", "huggingface_hub>=0.23", "einops>=0.7", "safetensors>=0.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["aiotrade", "aiotrade.broker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
