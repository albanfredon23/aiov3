# AIOTrade : démarrage complet en une commande
#   docker compose up --build
# puis ouvrir http://localhost:8088 (port modifiable via AIOTRADE_PORT).
name: aiotrade

services:
  engine:
    build:
      context: ./engine
      target: runtime
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    expose:
      - "8000"

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      engine:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    ports:
      - "${AIOTRADE_PORT:-8088}:8080"
